name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t events-api:latest .

      - name: Start container
        run: docker run -d --name events-api-container -p 5000:5000 events-api:latest

      - name: Wait for API and check health
        run: |
          sleep 5
          curl --fail http://localhost:5000/api/health

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest requests

      - name: Run tests
        env:
          BASE_URL: http://localhost:5000
        run: pytest -v

      - name: Stop and remove container
        if: always()
        run: docker rm -f events-api-container

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest .

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/events-api:latest

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail -sS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null

      - name: Wait for deployment
        run: sleep 45

      - name: Smoke test
        env:
          RENDER_BASE_URL: ${{ secrets.RENDER_BASE_URL }}
        run: curl --fail --max-time 120 --retry 5 --retry-delay 10 "$RENDER_BASE_URL/api/health"