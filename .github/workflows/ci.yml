name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t events-api:latest .

      - name: Start container
        run: docker run -d --name events-api-container -p 5000:5000 events-api:latest

      - name: Wait for API and check health
        run: |
          sleep 5
          curl --fail http://localhost:5000/api/health

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest requests

      - name: Run tests
        env:
          BASE_URL: http://localhost:5000
        run: pytest -v

      - name: Stop and remove container
        if: always()
        run: docker rm -f events-api-container